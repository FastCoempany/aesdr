<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partnerships OS · The First 90 · AESDR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Space+Mono:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@400;500;600;700;800&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#8B1A1A;--crimson-d:#6e1414;--cream:#FAF7F2;--ink:#1A1A1A;--muted:#6B6B6B;--light:#E8E4DF;
    --iris:linear-gradient(90deg,#FF006E 0%,#FF6B00 17%,#F59E0B 34%,#10B981 51%,#38BDF8 68%,#8B5CF6 85%,#FF006E 100%);
    --display:'Playfair Display',Georgia,serif;
    --serif:'Source Serif 4',Georgia,serif;
    --cond:'Barlow Condensed',sans-serif;
    --mono:'Space Mono',monospace;
    --hand:'Caveat',cursive;
    --ok:#10B981;--paper:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--ink);font-family:var(--serif);line-height:1.6;-webkit-font-smoothing:antialiased}
  @keyframes shimmer{to{background-position:300% 0}}
  ::selection{background:var(--ink);color:var(--cream)}

  .iris-text{background:var(--iris);background-size:300% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 5s linear infinite}
  .iris-line{height:2px;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite}

  /* ─── Layout shell ─── */
  .app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
  @media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;transition:left .25s ease;z-index:400}.sidebar.open{left:0}.menuToggle{display:flex!important}}

  /* ─── Sidebar ─── */
  .sidebar{background:var(--ink);color:var(--cream);position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid #000;display:flex;flex-direction:column}
  .sidebar::-webkit-scrollbar{width:7px}.sidebar::-webkit-scrollbar-thumb{background:#333}
  .brandBox{padding:24px 22px 18px;border-bottom:1px solid rgba(250,247,242,.1);position:relative}
  .brandBox::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite;opacity:.5}
  .brandWord{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;letter-spacing:.01em}
  .brandSub{font-family:var(--mono);font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:rgba(250,247,242,.55);margin-top:4px}
  .navList{padding:14px 0;flex:1}
  .navGroup{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:rgba(250,247,242,.4);padding:16px 22px 6px}
  .navItem{display:flex;align-items:center;gap:10px;padding:9px 22px;color:rgba(250,247,242,.78);text-decoration:none;font-family:var(--cond);font-size:14px;letter-spacing:.06em;cursor:pointer;border-left:2px solid transparent;transition:all .12s ease}
  .navItem:hover{background:rgba(250,247,242,.05);color:#fff}
  .navItem.active{border-left-color:var(--crimson);color:#fff;background:rgba(139,26,26,.18)}
  .navItem .ni-num{font-family:var(--mono);font-size:10px;color:rgba(250,247,242,.4);min-width:16px}
  .navFoot{padding:16px 22px;border-top:1px solid rgba(250,247,242,.1);font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(250,247,242,.4);line-height:1.7}
  .navFoot b{color:var(--crimson)}

  /* sidebar mascot */
  .sideMascot{width:64px;height:64px;margin:8px auto 4px;display:block;opacity:.92}

  /* ─── Main ─── */
  .main{min-width:0;padding:0 0 120px}
  .menuToggle{display:none;position:fixed;top:14px;left:14px;z-index:401;background:var(--ink);color:var(--cream);border:none;width:42px;height:42px;font-size:18px;cursor:pointer;align-items:center;justify-content:center}

  /* top status bar */
  .statusBar{position:sticky;top:0;z-index:200;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--light);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .dayPill{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:10px}
  .dayPill .dot{width:8px;height:8px;border-radius:50%;background:var(--crimson)}
  .dayControls{display:flex;align-items:center;gap:8px}
  .dayControls button{font-family:var(--mono);font-size:11px;letter-spacing:.12em;background:transparent;border:1px solid var(--ink);color:var(--ink);padding:5px 10px;cursor:pointer}
  .dayControls button:hover{background:var(--ink);color:var(--cream)}
  .dayControls input{width:62px;font-family:var(--mono);font-size:12px;text-align:center;border:1px solid var(--ink);padding:5px 4px;background:#fff}
  .progWrap{flex:1;min-width:160px;max-width:340px}
  .progLabel{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
  .progTrack{height:7px;background:var(--light);position:relative;overflow:hidden}
  .progFill{height:100%;width:0;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite;transition:width .4s ease}

  .content{max-width:1000px;margin:0 auto;padding:40px 32px 0}
  @media(max-width:600px){.content{padding:28px 18px 0}.statusBar{padding:10px 16px}}

  /* section */
  .section{display:none;animation:fade .3s ease}
  .section.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .secEyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--crimson);margin-bottom:14px}
  h1.secTitle{font-family:var(--display);font-style:italic;font-weight:900;font-size:clamp(34px,5.5vw,60px);line-height:1.02;margin-bottom:16px}
  .secLede{font-family:var(--serif);font-size:18px;line-height:1.7;color:var(--ink);max-width:680px;margin-bottom:14px}
  .secLede em{color:var(--muted);font-style:italic}
  .secDivider{width:60px;margin:28px 0 36px}

  /* hero (day 1) */
  .hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:24px 0 8px}
  @media(max-width:680px){.hero{grid-template-columns:1fr}}
  .heroMascot{width:240px;height:240px}
  .heroMascot img{width:100%;height:100%;object-fit:contain}
  .signoff{font-family:var(--hand);font-size:26px;color:var(--ink);transform:rotate(-1deg);margin-top:8px}
  .signoff::before{content:'— '}

  /* phase ribbon */
  .ribbon{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0 40px}
  @media(max-width:680px){.ribbon{grid-template-columns:1fr}}
  .ribCard{border:1px solid var(--ink);padding:18px 20px;position:relative;background:#fff;cursor:pointer;transition:transform .15s}
  .ribCard:hover{transform:translateY(-2px)}
  .ribCard::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite;opacity:0;transition:opacity .2s}
  .ribCard:hover::before{opacity:1}
  .ribNum{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--crimson);text-transform:uppercase;margin-bottom:8px}
  .ribTitle{font-family:var(--display);font-style:italic;font-weight:700;font-size:22px;margin-bottom:8px}
  .ribGoal{font-family:var(--serif);font-size:13.5px;color:var(--muted);line-height:1.5}
  .ribMeter{margin-top:12px;height:5px;background:var(--light)}
  .ribMeter span{display:block;height:100%;background:var(--crimson);width:0;transition:width .4s}

  /* week block */
  .week{margin-bottom:14px;border:1px solid var(--light);background:#fff}
  .weekHead{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:14px;background:#fff;transition:background .12s}
  .weekHead:hover{background:rgba(0,0,0,.015)}
  .weekHead.open{border-bottom:1px solid var(--light)}
  .weekL{display:flex;align-items:baseline;gap:14px;min-width:0}
  .weekTag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);white-space:nowrap}
  .weekTitle{font-family:var(--display);font-style:italic;font-weight:700;font-size:19px;color:var(--ink)}
  .weekMeta{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .weekCount{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted)}
  .weekChev{font-family:var(--display);font-style:italic;font-size:18px;color:var(--crimson);transition:transform .2s}
  .weekHead.open .weekChev{transform:rotate(180deg)}
  .weekBody{display:none;padding:8px 20px 18px}
  .weekBody.open{display:block}
  .weekIntro{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14.5px;padding:12px 0 14px;border-bottom:1px dashed var(--light);margin-bottom:12px}

  /* task */
  .task{border-left:2px solid var(--light);padding:2px 0 2px 0;margin-bottom:4px}
  .taskHead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 14px;cursor:pointer;transition:background .1s}
  .taskHead:hover{background:rgba(139,26,26,.03)}
  .checkbox{width:20px;height:20px;border:1.5px solid var(--ink);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;transition:all .12s}
  .checkbox.done{background:var(--crimson);border-color:var(--crimson)}
  .checkbox.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
  .taskMain{min-width:0}
  .taskTitle{font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .task.done .taskTitle{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--light)}
  .taskTags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--light);color:var(--muted)}
  .tag.agent{border-color:var(--crimson);color:var(--crimson);cursor:pointer}
  .tag.cli{border-color:var(--ink);color:var(--ink)}
  .tag.who{background:rgba(0,0,0,.03)}
  .tag.t-day{color:#a14400;border-color:#e6c9a8}
  .taskChev{font-family:var(--display);font-style:italic;font-size:15px;color:var(--muted);transition:transform .2s;padding-top:2px}
  .task.open .taskChev{transform:rotate(180deg);color:var(--crimson)}
  .taskDetail{display:none;padding:4px 14px 18px 46px}
  .task.open .taskDetail{display:block}

  /* step list inside task */
  .steps{counter-reset:step;margin:6px 0 0}
  .step{position:relative;padding:7px 0 7px 34px;font-size:14.5px;line-height:1.55;border-bottom:1px dashed var(--light)}
  .step:last-child{border-bottom:none}
  .step::before{counter-increment:step;content:counter(step);position:absolute;left:0;top:7px;width:22px;height:22px;background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:10px;display:flex;align-items:center;justify-content:center}
  .step b{font-weight:700}
  .step code,.inlineCode{font-family:var(--mono);font-size:12.5px;background:var(--light);padding:1px 6px;border-radius:2px}
  .step .ui{font-family:var(--cond);font-weight:700;letter-spacing:.04em;background:var(--ink);color:var(--cream);padding:1px 8px;font-size:12.5px;text-transform:uppercase}
  .step .where{font-family:var(--mono);font-size:11px;color:var(--crimson);letter-spacing:.05em}

  /* code block */
  .codeBlock{position:relative;margin:12px 0;background:#11141a;border:1px solid #000;overflow:hidden}
  .codeBlock pre{padding:16px 16px 16px 18px;overflow-x:auto;color:#e8e4df;font-family:var(--mono);font-size:12.5px;line-height:1.7}
  .codeBlock .cbHead{display:flex;justify-content:space-between;align-items:center;padding:7px 14px;background:#000;border-bottom:1px solid #222}
  .codeBlock .cbLabel{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#888}
  .copyBtn{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid #444;color:#aaa;padding:4px 9px;cursor:pointer;transition:all .12s}
  .copyBtn:hover{border-color:var(--crimson);color:#fff}
  .copyBtn.copied{border-color:var(--ok);color:var(--ok)}
  .pre-c{color:#7fd1b9}.pre-k{color:#c792ea}.pre-s{color:#ecc48d}.pre-m{color:#637777;font-style:italic}

  /* callouts */
  .callout{border-left:3px solid var(--crimson);background:rgba(139,26,26,.045);padding:12px 16px;margin:12px 0;font-size:14px;line-height:1.6}
  .callout.who{border-left-color:var(--ink);background:rgba(0,0,0,.03)}
  .callout .cTitle{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--crimson);margin-bottom:6px}
  .callout.who .cTitle{color:var(--ink)}
  .handNote{font-family:var(--hand);font-size:19px;color:var(--ink);transform:rotate(-.5deg);margin:10px 0 4px;padding-left:18px;position:relative}
  .handNote::before{content:'»';position:absolute;left:0;color:var(--crimson);font-family:var(--display);font-style:italic}

  /* dispatch lines (paste-into-Claude-Code) + done-when bar */
  .dispatchWrap{margin:14px 0;border:1px solid var(--crimson);background:rgba(139,26,26,.04)}
  .dispatchLabel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--crimson);padding:9px 14px;border-bottom:1px solid rgba(139,26,26,.2);display:flex;align-items:center;gap:8px}
  .dispatchLine{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px dashed rgba(139,26,26,.14)}
  .dispatchLine:last-child{border-bottom:none}
  .dispatchLine code{flex:1;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink);background:transparent;padding:0;border-radius:0}
  .dispatchCopy{flex-shrink:0;border-color:var(--crimson)!important;color:var(--crimson)!important}
  .dispatchCopy:hover{background:var(--crimson)!important;color:#fff!important}
  .doneBar{margin:14px 0 2px;padding:11px 14px;background:var(--ink);color:var(--cream);font-size:13.5px;line-height:1.5;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .doneTag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ok);border:1px solid var(--ok);padding:2px 8px;flex-shrink:0}

  /* verbatim call script */
  .callScript{margin:16px 0;border:1px solid var(--ink);background:#fff}
  .callScriptHead{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--light);gap:10px}
  .csTitle{font-family:var(--display);font-style:italic;font-weight:700;font-size:17px}
  .callScriptBody{padding:14px 18px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
  .callScriptBody .cue{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--crimson);text-transform:uppercase;margin-top:6px}

  /* if-it-stalls branches */
  .stallWrap{margin:14px 0;border-left:3px solid #a14400;background:rgba(161,68,0,.05);padding:12px 16px}
  .stallLabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a14400;margin-bottom:8px}
  .stallRow{padding:8px 0;border-bottom:1px dashed rgba(161,68,0,.2);font-size:14px;line-height:1.6}
  .stallRow:last-child{border-bottom:none}
  .stallTrigger{font-family:var(--mono);font-size:11px;color:#a14400;letter-spacing:.02em;font-weight:700}

  /* agent cards */
  .agentGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:24px 0}
  .agentCard{border:1px solid var(--ink);background:#fff;padding:22px;position:relative;display:flex;flex-direction:column}
  .agentCard::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite}
  .agentName{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1}
  .agentRole{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--crimson);margin:6px 0 12px}
  .agentDesc{font-size:14px;line-height:1.6;color:var(--ink);margin-bottom:12px;flex:1}
  .agentMaps{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);border-top:1px dashed var(--light);padding-top:10px;margin-bottom:12px}
  .agentMaps b{color:var(--ink)}
  .agentBtn{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:var(--cream);border:none;padding:11px;cursor:pointer;width:100%;transition:background .12s}
  .agentBtn:hover{background:var(--crimson)}

  /* resource + table */
  .rTable{width:100%;border-collapse:collapse;margin:18px 0;font-size:14px;background:#fff;border:1px solid var(--light)}
  .rTable th{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:2px solid var(--ink);font-weight:700}
  .rTable td{padding:11px 14px;border-bottom:1px solid var(--light);vertical-align:top;line-height:1.5}
  .rTable tr:last-child td{border-bottom:none}
  .rTable a{color:var(--crimson);text-decoration:underline}
  .rTable .src{font-family:var(--mono);font-size:11px;letter-spacing:.04em}
  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 7px;border:1px solid;display:inline-block}
  .badge.hi{color:var(--ok);border-color:var(--ok)}
  .badge.mid{color:#a14400;border-color:#e6c9a8}
  .badge.lo{color:var(--muted);border-color:var(--light)}

  /* matrix */
  .matrix{overflow-x:auto;margin:20px 0}
  .matrix table{border-collapse:collapse;width:100%;min-width:680px;font-size:13.5px;background:#fff;border:1px solid var(--light)}
  .matrix th{background:var(--ink);color:var(--cream);font-family:var(--cond);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:12px;text-align:left}
  .matrix td{padding:11px 12px;border-bottom:1px solid var(--light);border-right:1px solid var(--light);vertical-align:top;line-height:1.45}
  .matrix tr td:first-child{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:rgba(0,0,0,.02)}
  .matrix .pick{background:rgba(139,26,26,.07)}
  .matrix .pick td:first-child{color:var(--crimson)}

  /* template card */
  .tmpl{border:1px solid var(--light);background:#fff;margin:14px 0}
  .tmplHead{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--light);gap:10px;flex-wrap:wrap}
  .tmplName{font-family:var(--display);font-style:italic;font-weight:700;font-size:17px}
  .tmplMeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
  .tmplBody{padding:16px;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
  .tmplBody .var{background:rgba(139,26,26,.1);color:var(--crimson);padding:0 3px;font-family:var(--mono);font-size:12.5px}

  /* metric tiles */
  .metricGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:20px 0}
  .metric{border:1px solid var(--light);background:#fff;padding:18px 20px;position:relative}
  .metric .mNum{font-family:var(--display);font-style:italic;font-weight:900;font-size:38px;line-height:1;color:var(--ink)}
  .metric .mLabel{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .metric .mTarget{font-family:var(--serif);font-size:13px;font-style:italic;color:var(--crimson);margin-top:8px}

  /* modal */
  .modalScrim{position:fixed;inset:0;background:rgba(26,26,26,.6);z-index:500;display:none;align-items:center;justify-content:center;padding:24px}
  .modalScrim.open{display:flex}
  .modal{background:var(--cream);border:1px solid var(--ink);max-width:680px;width:100%;max-height:86vh;overflow-y:auto;position:relative}
  .modal::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--iris);background-size:300% 100%;animation:shimmer 5s linear infinite;z-index:2}
  .modalHead{padding:24px 28px 16px;border-bottom:1px solid var(--light);display:flex;justify-content:space-between;align-items:start;gap:16px;position:sticky;top:0;background:var(--cream)}
  .modalClose{background:none;border:none;font-size:24px;cursor:pointer;color:var(--muted);line-height:1}
  .modalBody{padding:20px 28px 28px}

  /* misc */

<script>
/* ════════════════════════════════════════════════════════════════
   AESDR PARTNERSHIPS OS — DATA MODEL
   Facts sourced from the live codebase (prices $249/$299, 40% commission set rate,
   30-day attribution, archetypes, inboxes, stack). Agent roster is DEFINED
   HERE, not recalled from a prior session — rename/reject freely.
   ════════════════════════════════════════════════════════════════ */

/* helper to keep strings clean */
const C = (cmd,label) => ({cmd,label:label||'shell'});

/* ─── AGENT ROSTER (proposed) ─── */
const AGENTS = [
  {id:'scout', name:'Scout', role:'Partner Discovery', pose:'sprint',
   desc:'Sweeps practitioner networks, paid-community directories (Skool, Mighty Networks), sales newsletters and podcasts. Returns scored candidate rows — never a raw dump. Reads excerpts, not whole pages, so it locates partners fast.',
   maps:'Claude Code <b>Explore</b> / <b>general-purpose</b> agent · tools: WebSearch, WebFetch, Bash',
   prompt:`You are Scout, AESDR's partner-discovery agent. Find candidate AFFILIATE partners for AESDR (a self-paced sales curriculum for first-1-2-year SDRs/AEs in startup SaaS; $249/$299 one-time; brand voice is operator-direct, anti-guru).

HARD RULE: never propose mass affiliate marketplaces (Rakuten, CJ, ShareASale, Impact-as-marketplace). We source from PRACTITIONER NETWORKS only.

Sweep these surfaces and return 15 candidates:
- Skool + Mighty Networks paid sales communities (community owner = the candidate)
- Independent sales newsletters (Substack/Beehiiv) with operator (not influencer) voice
- Sales podcasts with host-read potential
- 30MPC-adjacent, Outbound Squad-adjacent, RepVue contributors, Modern Sales Pros members

For each candidate return a row:
| name | surface/handle | audience size (est) | archetype guess (creator/coach/alumni/community) | voice-fit 1-5 | why-fit (1 line) | contact path (NOT LinkedIn) |

Score voice-fit honestly. A guru-aesthetic creator is a 1, an operator-who-teaches is a 5. Flag anyone already sponsored by a sales-tool vendor (conflict risk).`},

  {id:'dossier', name:'Dossier', role:'Candidate Enrichment', pose:'diagnosis',
   desc:'Takes one name and builds the full profile before you reach out: real audience size, content cadence, voice-fit read against canon, existing commercial relationships, and the warm-or-cold contact path. Turns a name into a decision.',
   maps:'Claude Code <b>general-purpose</b> agent · tools: WebFetch, WebSearch, Read (canon docs)',
   prompt:`You are Dossier, AESDR's candidate-enrichment agent. I'll give you ONE partner candidate. Build a pre-outreach brief:

1. Audience: where, how big, how engaged (cite the surfaces you checked).
2. Content cadence + 3 representative pieces (links). Quote 2 lines that reveal their voice.
3. Voice-fit verdict against AESDR canon (operator-direct, anti-guru, plain English). Score 1-5 + one-sentence rationale. Pull the blocklist test: do they say "crush it / level up / unlock your potential"? If yes, score down.
4. Commercial posture: do they already promote courses/tools? Any conflicts?
5. Contact path that is NOT LinkedIn — newsletter reply address, public email, Twitter/X DMs open?, community DM, podcast guest-pitch form.
6. The single best angle for first-touch, in one sentence.

Output as a one-screen brief. If they're a clear no, say so in line 1 and stop.`},

  {id:'scribe', name:'Scribe', role:'Outreach Copy', pose:'doctrine',
   desc:'Drafts first-touch and the full follow-up ladder in AESDR voice, run against the canon blocklist before it hands anything back. Personalizes from a Dossier brief. Never sends — you send.',
   maps:'Claude Code <b>claude</b> agent · reads AFFILIATE_BRAND_CANON.md + canon-revisions · canon-check before output',
   prompt:`You are Scribe, AESDR's outreach copywriter. Using the Dossier brief I paste below, draft a first-touch message + a 3-step follow-up ladder for an AFFILIATE partner.

VOICE: operator-direct, plain, peer-to-peer. No "crush it / level up / unlock / passionate / rockstar." No flattery padding. Lead with the specific reason THEY fit, not a pitch about us. Reference one real thing they made.

CONSTRAINTS:
- First-touch ≤ 120 words. One ask: a 15-min call OR "want the partner kit?"
- Follow-up 1 (day +4): add one new piece of value, not a nag.
- Follow-up 2 (day +9): the honest close — "last note, no hard feelings."
- Disclose the economics plainly: 40% commission, 30-day attribution window, one-time $249/$299 product.
- Reply-to is affiliates@aesdr.com.

Run your own draft against the canon blocklist before returning. Flag any line you're unsure on.`},

  {id:'ledger', name:'Ledger', role:'Attribution & Ops', pose:'owner',
   desc:'Runs the Supabase queries, reconciles payouts, builds the weekly reporting pull. Lives in the terminal. The agent you hand the boring-but-load-bearing numbers work.',
   maps:'Claude Code <b>general-purpose</b> agent · tools: Bash (supabase CLI, psql), Read · service-role scoped',
   prompt:`You are Ledger, AESDR's attribution + ops agent. You operate the Supabase project for the affiliate program.

Tasks I'll hand you:
- Build/extend the partner_pipeline table + reporting views.
- Weekly pull: new clicks, attributed enrollments, pending vs cleared commission, refund-window status, payout-ready totals — per affiliate and in aggregate.
- Reconcile a payout batch before I approve it.

RULES: read-only by default; show me the SQL before any write; never run a destructive statement without surfacing the row count it will touch. Use the affiliates + affiliate_attributions + affiliate_payouts tables. Output money as dollars, not cents. Flag anomalies (e.g., refund rate > 15%, a single affiliate > 60% of volume).`},

  {id:'warden', name:'Warden', role:'Brand-Fit Governance', pose:'verdict',
   desc:'Reviews affiliate copy submissions against canon before they post. The gate that keeps borrowed trust from turning into the guru register. Approves, requests edits, or declines with a reason.',
   maps:'Claude Code <b>claude</b> agent · runs scripts/canon-check.mjs + reads canon-revisions',
   prompt:`You are Warden, AESDR's brand-fit reviewer. I'll paste an affiliate's submitted copy. Judge it against the canon.

Return one verdict: APPROVE / EDITS / DECLINE.
- APPROVE: reads in our register, discloses the affiliate relationship, no banned terms.
- EDITS: fixable. List each line + the exact rewrite. Keep their voice, fix the register.
- DECLINE: guru-coded, misrepresents the product, or claims outcomes we don't promise. Give the category + one-sentence reason (this maps to the 3-strike policy).

- Sales-training firms that lack a junior-rep curriculum (we fill their gap, not compete)

   maps:'Claude Code <b>claude</b> agent · reads partner_pipeline + this plan\'s progress state',

FRIDAY REVIEW (10 min): pull the week — outreach sent, replies, calls booked, affiliates activated, commission trajectory vs the 30/60/90 milestone. Tell me what worked, what to cut, and the one bet for next week. Write it as 8 lines, not a report.

Never pad. If a day is light, say "light day, do X and stop."`}

    '<b>Write down the economics baked into the schema</b> (you\'ll quote these on every call): <b>commission 40%</b>, <b>30-day attribution window</b>, archetypes (creator/coach/alumni/hybrid/community), tiers (developing/proven), the 3-strike policy, the copy-gate (3 approved pieces for developing, 1 for proven).',
    '<b>Walk the admin surfaces</b> in the browser, in order: <span class="where">aesdr.com/admin/affiliates</span> (roster — see who exists) → <span class="where">/admin/affiliates/queue</span> (copy review — where Warden\'s verdicts land) → <span class="where">/admin/affiliates/new</span> (the manual-add form you\'ll use to onboard in Week 5). Click into one existing affiliate to see the detail page.',
    '<b>Walk the affiliate-facing surfaces</b> as a partner sees them: <span class="where">/affiliates/dashboard</span> (their home) → <span class="where">/affiliates/dashboard/playbooks</span> (the per-archetype roadmaps) → <span class="where">/affiliates/kit-private</span> (the gated kit). <b>Done when</b> you\'ve written the honest baseline in one line: X affiliates, Y active, $Z attributed to date.'
   ],
   code:[{label:'see who is already in the program',lang:'sql',body:`-- run via: supabase db query  (or the SQL editor)
select slug, display_name, status, archetype, sophistication_tier,
       commission_pct, approved_pieces_count, joined_at
from affiliates
order by joined_at desc;

-- current attribution + commission picture
select a.slug, count(att.*) as attributions,
       sum(att.commission_amount_cents)/100.0 as commission_dollars,
       att.status
from affiliates a
left join affiliate_attributions att on att.affiliate_slug = a.slug
group by a.slug, att.status
order by commission_dollars desc nulls last;`}],
   callouts:[{type:'note',title:'The honest baseline',body:'Write down the real starting numbers today: X affiliates, Y active, $Z attributed to date. Every milestone in this plan measures against this line. No vanity baselines.'}]
  },
  {id:'w1t5',title:'Day 3 — Stand up the partner pipeline (your CRM, in Supabase)',day:3,tags:[CLI(),A('ledger')],
   steps:[
    'You are not using LinkedIn and you are not buying a CRM seat in week 1. The pipeline lives where the rest of the data lives: Supabase. <b>Dispatch Ledger</b> (line below) to create the table from the migration in the block.',
    '<b>Create the migration file:</b> in Terminal, <code>supabase migration new partner_pipeline</code>. This makes an empty timestamped file in <code>supabase/migrations/</code>.',
    '<b>Paste the SQL</b> from the block below into that new file and save. It defines the table, the status enum (sourced→enriched→contacted→…→activated), the affiliate/channel motion check, and the indexes.',
    '<b>Push it live:</b> <code>supabase db push</code>. Supabase prints the diff and asks to confirm — type <code>y</code>. This is the spine of the motion: Scout writes candidates in, Dossier enriches, Scribe updates outreach status, Almanac reads it every morning.',
    '<b>Verify it landed:</b> <code>supabase db query "select count(*) from partner_pipeline;"</code> — must return <code>0</code> (table exists, empty). <b>Done when</b> that returns 0 rows.',
    '<b>Add the one-click view:</b> open <code>components/AdminChip.tsx</code>, add a "Partner Pipeline" entry pointing at <code>/admin/pipeline</code> (you have repo write — or hand the founder the 2-min change). You want a clickable board by end of week, not SQL-only.'
   ],
   code:[{label:'supabase/migrations/20260601_partner_pipeline.sql',lang:'sql',body:`-- Partner pipeline: the partnerships-role CRM, native to Supabase.
create table if not exists partner_pipeline (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  surface text,                       -- newsletter / podcast / Skool / community
  handle text,                        -- @ or URL (never LinkedIn)
  motion text not null default 'affiliate'
    check (motion in ('affiliate','channel')),
  archetype text,                     -- creator/coach/alumni/community (affiliate)
  audience_est int,
  voice_fit int check (voice_fit between 1 and 5),
  status text not null default 'sourced' check (status in
    ('sourced','enriched','contacted','replied','call_booked',
     'negotiating','activated','passed','cold')),
  contact_path text,                  -- the NON-LinkedIn way in
  why_fit text,
  owner text default 'antaeus',
  next_action text,
  next_action_date date,
  source_agent text,                  -- which agent surfaced them
  notes jsonb not null default '[]'::jsonb,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
create index if not exists pp_status_idx on partner_pipeline(status);
create index if not exists pp_motion_idx on partner_pipeline(motion);
create index if not exists pp_next_idx on partner_pipeline(next_action_date);
alter table partner_pipeline enable row level security;
-- service-role only (you reach it via CLI / admin); no anon policy.`},
    {label:'create + push the migration',lang:'bash',body:`# create the file (paste the SQL above into it)
supabase migration new partner_pipeline

# push to the live project
supabase db push

# verify
supabase db query "select count(*) from partner_pipeline;"`}],
   callouts:[{type:'who',title:'2-minute founder assist',body:'Ask the founder to add a "Partner Pipeline" entry to the AdminChip (components/AdminChip.tsx) pointing at a simple /admin/pipeline view — or do it yourself, you have write access. Either way you want a clickable board, not SQL-only, by end of week.'}]
  },
  {id:'w1t6',title:'Day 4 — Build the discovery doctrine (write it down)',day:4,tags:[A('scout')],
   steps:[
    'The JD says "discovery process documented" by day 30. Do it on day 4 so the next three weeks execute against it instead of improvising.',
    '<b>Create the doc:</b> macOS — <code>mkdir -p docs/partnerships && touch docs/partnerships/discovery-doctrine.md</code>; Windows — <code>New-Item docs\\partnerships -ItemType Directory -ea 0; New-Item docs\\partnerships\\discovery-doctrine.md -ItemType File</code>. Then open it (<code>code docs/partnerships/discovery-doctrine.md</code> if VS Code is installed) and write one page covering four things: (1) the sourcing rule — practitioner networks, never marketplaces, never LinkedIn; (2) the voice-fit bar — score 1–5, reject anything ≤2; (3) the archetype targets — creator / coach / alumni / community; (4) the disqualifiers — guru aesthetic, vendor-sponsored conflicts, audience under ~1k engaged.',
    '<b>Dispatch Scout</b> (line below) to run Sweep 1 against that doctrine: 15 candidates across Skool, Mighty Networks, and independent sales newsletters. Scout returns a scored table — it does not invent names.',
    '<b>Pipe survivors to Dossier:</b> for every Scout row scoring voice-fit ≥3, dispatch Dossier to enrich it (real audience size, cadence, conflicts, the non-LinkedIn contact path).',
    '<b>Write them in:</b> have Ledger insert each enriched candidate into <code>partner_pipeline</code> at status <code>enriched</code>. <b>Done when</b> <code>docs/partnerships/discovery-doctrine.md</code> is committed and Scout has returned its first 15.'
   ],
   callouts:[{type:'note',title:'The doctrine is a filter, not a formality',body:'You will be tempted by a creator with 100k followers and a guru voice. The doctrine is what lets you say no to them on day 12 without re-litigating it. Borrowed trust is a merciless mirror — a bad-fit partner damages the brand faster than a good one helps.'}]
  },
  {id:'w1t7',title:'Day 5 — The attribution-platform decision (start the clock)',day:5,tags:[A('ledger'),DAY('decision by day 30')],
   steps:[
    'The JD makes this YOUR call by day 30. Start the evaluation now; you decide in Week 4 once you\'ve felt the real volume.',
    '<b>Open the matrix:</b> in this OS\'s sidebar click <span class="ui">Attribution Decision</span>. The four contenders with verified May-2026 pricing are there: extend the custom Supabase+Stripe system ($0), Rewardful ($49/$99/mo), PartnerStack (~$800+/mo est.), Impact ($30/mo or 3% + 2.5% network tax).',
    '<b>Note the constraint from the schema</b> (you saw it in w1t4): AESDR already has a working custom attribution system — <code>affiliate_attributions</code>, 30-day window, Stripe Connect payouts. The real question is build-vs-buy for partner-facing dashboards + automated payouts, not "do we have attribution."',
    '<b>Dispatch Ledger</b> (line below) to estimate the build-cost of the three gaps the custom system has: (1) partner self-serve dashboard, (2) automated payout scheduling, (3) link-level click tracking. That number is your "build" side of build-vs-buy. <b>Done when</b> you\'ve opened the matrix and the estimate exists — the decision itself is day ~25, on purpose.'
   ],
   callouts:[{type:'note',title:'Don\'t decide today',body:'Anyone who picks the attribution platform on day 5 is guessing. You pick on day ~25 when you know your real partner count, payout cadence, and how much partner-facing polish you actually need. Today you just open the evaluation.'}]
  }
 ]},

{phase:'p30',tag:'Week 2 · Days 6–10',title:'The list. Fifty names, scored.',
 intro:'This is the highest-leverage week of the quarter. A tight, scored target list of the right fifty partners beats a thousand marketplace signups. You will live in Scout and Dossier this week.',
 tasks:[
  {id:'w2t1',title:'Days 6–7 — Run the full discovery sweep (target: 50 scored rows)',day:6,tags:[A('scout'),A('dossier')],
   steps:[
    '<b>Head start:</b> the first sweep is already run — open <span class="ui">Prospect Intel</span> in the sidebar for 10 named affiliate candidates (Neil Bhuiyan, Florin Tatulea, Stefan Conic, …) with voice-fit scores and contact paths, plus 3 hard-conflict do-not-approach names. Your job this week: verify those, then extend to 50.',
    '<b>Dispatch Scout three times</b> (the three lines below), scoped to three surfaces so results don\'t blur together. Run them as separate dispatches, not one:',
    '<b>Sweep 1 — paid communities</b> (copy line 1): Skool + Mighty Networks + Circle. The community OWNER is the candidate. Filter to sales / SDR / AE / revenue, 50–2,000 members.',
    '<b>Sweep 2 — newsletters + podcasts</b> (line 2): independent sales newsletters (Substack/Beehiiv) + operator-host podcasts. Contact path = reply-to address or guest-pitch form.',
    '<b>Sweep 3 — practitioner-network figures</b> (line 3): active contributors in 30MPC, Outbound Squad, RepVue, Modern Sales Pros, Apex BDR Club, Pavilion who have their OWN audience — not just members.',
    '<b>Enrich + write in</b> (line 4): pipe every result scoring voice-fit ≥3 to Dossier, then have Ledger insert survivors (block below). <b>Done when</b> 50 rows sit at status <code>enriched</code> in <code>partner_pipeline</code> by end of Day 7.'
   ],
   callouts:[{type:'who',title:'The people, concretely',body:'See the <b>Resource Vault</b> in the sidebar for the named starting-point list — communities, newsletters, podcasts, and networks, with where to find each. No LinkedIn anywhere on it.'}],
   code:[{label:'bulk-insert Scout results (Ledger does this for you)',lang:'sql',body:`-- Ledger formats Scout's rows into this insert.
insert into partner_pipeline
  (name, surface, handle, motion, archetype, audience_est,
   voice_fit, status, contact_path, why_fit, source_agent, next_action, next_action_date)
values
  ('<name>','newsletter','<url>','affiliate','creator',8500,
   4,'enriched','reply-to: hello@<their-domain>',
   'Operator voice, writes to first-2-yr reps weekly','scout',
   'Dispatch Scribe for first-touch', current_date + 1);`}]
  },
  {id:'w2t2',title:'Days 8–9 — Score, rank, and cut to the top 25',day:8,tags:[A('dossier')],
   steps:[
    '<b>Run the ranking query</b> (block below) via Ledger or <code>supabase db query</code>. It scores every enriched row by the composite <b>voice-fit (×3) + audience-fit (×2) + reachability (×1)</b> and returns the top 25.',
    '<b>Why reachability is weighted:</b> you have no LinkedIn — a 5k newsletter with an open reply address beats a 50k audience locked behind a gatekeeper. The query already caps audience influence so a huge-but-unreachable name can\'t buy its way up.',
    '<b>Apply two hard cuts by hand</b> on the ranked list: cut anyone voice-fit ≤2 regardless of audience; cut anyone sponsored by a competing sales-course or a sales-tool vendor whose lessons you\'d contradict (Prospect Intel already flags the 3 hard conflicts — keep them out).',
    '<b>Update statuses</b> (block): top 25 stay <code>enriched</code> and get a <code>next_action_date</code>; everyone else moves to <code>cold</code> — <u>not deleted</u>, they\'re your Phase-90 second wave. <b>Done when</b> the top 25 each have a <code>next_action_date</code> and the rest read <code>cold</code>.'
   ],
   code:[{label:'rank the pipeline',lang:'sql',body:`select name, surface, audience_est, voice_fit,
       (voice_fit*3) + (least(audience_est,20000)/4000*2) as composite,
       contact_path
from partner_pipeline
where motion='affiliate' and status='enriched'
order by composite desc
limit 25;`}]
  },
  {id:'w2t3',title:'Day 10 — Pre-write the outreach library',day:10,tags:[A('scribe')],
   steps:[
    '<b>Dispatch Scribe</b> (line below) to draft the reusable scaffolding so every send is personalization-on-top-of-canon, not a blank page. The finished drafts already live in the <span class="ui">Outreach Library</span> section of this OS — Scribe regenerates/tunes them, you don\'t start cold.',
    '<b>Generate five pieces:</b> first-touch × 3 variants (newsletter-writer, community-owner, podcast-host), follow-up 1 (+4 days, adds value), follow-up 2 (+9 days, honest close). The first two sentences are the only bespoke part; the rest is templated.',
    '<b>Lock the disclosure block</b> (never edited per send): commission rate, 30-day attribution window, $249/$299 one-time product, paid via Stripe, reply-to <code>affiliates@aesdr.com</code>.',
    '<b>Save + check:</b> Scribe writes them to <code>content/partnerships/outreach/</code> (one file each). Run <code>node scripts/canon-check.mjs content/partnerships/outreach/</code> on the folder. <b>Done when</b> 5 templates are saved and each passes canon-check.'
   ],
   callouts:[{type:'note',title:'Personalize the top, never the disclosure',body:'The first two sentences are bespoke per partner (the reason THEY fit). The economics + the ask are templated and never edited — that\'s how you stay both personal and compliant at 25-partner scale.'}]
  }
 ]},

{phase:'p30',tag:'Week 3 · Days 11–15',title:'First contact.',
 intro:'Outreach begins. The number that matters this week is not "sends" — it\'s "replies that lead to a real conversation." Quality of fit, set in weeks 1–2, is what makes this week convert.',
 tasks:[
  {id:'w3t1',title:'Day 11 — Confirm the affiliates@ inbox actually delivers',day:11,tags:[CLI(),DAY('do before first send')],
   steps:[
    'Every outreach has reply-to <code>affiliates@aesdr.com</code>. Confirm the Cloudflare Email Routing rule exists and delivers BEFORE you send to 25 real people.',
    'In <span class="where">dash.cloudflare.com</span> → <b>aesdr.com</b> → <span class="ui">Email</span> → <span class="ui">Email Routing</span> → <span class="ui">Routing rules</span>, confirm <code>affiliates@aesdr.com</code> → forwards to the founder\'s inbox (it was ratified in the codebase; verify it\'s live in the dashboard).',
    'Send a test from a personal address to <code>affiliates@aesdr.com</code>. Confirm it lands within a minute.',
    'If it bounces, the rule isn\'t active — add it: <span class="ui">Create address</span> → <code>affiliates@aesdr.com</code> → <span class="ui">Send to</span> → founder\'s email. No DNS work needed; MX already points to Cloudflare.'
   ],
   callouts:[{type:'note',title:'Deliverability is the silent killer',body:'A first-touch from an address that bounces on reply is worse than no send. Five minutes of verification here protects 25 first impressions.'}]
  },
  {id:'w3t2',title:'Days 11–13 — Send the first 25 (paced, not blasted)',day:11,tags:[A('scribe'),WHO('25 partner candidates')],
   steps:[
    'Send in three waves of ~8/day, not all 25 at once — so you can respond to early replies same-day and tune the message between waves.',
    '<b>Where you send from</b> (set this up once, before wave 1): a real AESDR mailbox, one-to-one — <u>no sequencing tool</u>. A bulk sender makes 25 hand-picked operators feel like a blast and tanks the register the whole pitch depends on. In Gmail/Workspace: <span class="ui">Settings</span> → <span class="ui">Accounts</span> → <span class="ui">Send mail as</span> → add your AESDR address; then in the same panel set <b>Reply-to</b> to <code>affiliates@aesdr.com</code> so replies route to the shared inbox. Send each one individually — never CC, never BCC.',
    'For each: pull the Dossier brief → hand to <b>Scribe</b> (dispatch line below) → Scribe personalizes the top two sentences from the brief → you read it once (does it sound like a peer, not a vendor?) → paste into a new email → send from your AESDR address, reply-to <code>affiliates@aesdr.com</code>.',
    'Log each send in <code>partner_pipeline</code>: status → <code>contacted</code>, set <code>next_action</code> = "follow-up 1", <code>next_action_date</code> = +4 days.',
    'Wave 2 (Day 12) and Wave 3 (Day 13): adjust the first-touch based on Wave 1 reply rate. If nobody replies to the "want the kit?" ask, switch to the "15-min call" ask, or vice versa.'
   ],
   code:[{label:'mark a batch contacted',lang:'sql',body:`update partner_pipeline
set status='contacted',
    next_action='follow-up 1 (value-add)',
    next_action_date = current_date + 4,
    updated_at = now()
where name = any(array['<name1>','<name2>','<name3>']);`}]
  },
  {id:'w3t3',title:'Days 14–15 — Work the replies; book the first calls',day:14,tags:[WHO('repliers'),A('almanac')],
   steps:[
    '<b>Booking link is live:</b> <a class="ext" href="https://calendar.app.google/wFRpSWG2ehvNhgd4A" target="_blank">calendar.app.google/wFRpSWG2ehvNhgd4A</a> (Google Calendar Appointment Schedule on <code>hello@aesdr.com</code>, 15-min "AESDR partner intro", availability in <b>US Central / Chicago</b> business hours, checks <code>antaeus.coe@gmail.com</code> + <code>mrcoe7@gmail.com</code> for conflicts). Open it in a private window once to confirm the booking interface loads. This link goes in every yes-reply.',
    'Replies are the job now. Same-day response, every time. A warm reply that waits 48 hours cools.',
    'For a "yes, tell me more": reply with the <span class="where">/affiliates/kit</span> link + your booking link (<code>calendar.app.google/wFRpSWG2ehvNhgd4A</code>). Move them to <code>replied</code>, then <code>call_booked</code> once they pick a slot.',
    'For a "what\'s the commission?": the honest numbers — 40%, 30-day window, $249/$299 product, paid via Stripe. Don\'t hedge; the transparency is the pitch.',
    'For silence: leave them at <code>contacted</code> — the follow-up ladder (Day +4) handles them automatically. Dispatch <b>Almanac</b> each morning to surface who\'s due.'
   ],
   callouts:[{type:'who',title:'Booking link — already wired',body:'Google Calendar Appointment Schedule, 15-min "AESDR partner intro" event on <code>hello@aesdr.com</code>. URL: <code>calendar.app.google/wFRpSWG2ehvNhgd4A</code>. Cross-checks <code>antaeus.coe@gmail.com</code> + <code>mrcoe7@gmail.com</code> for conflicts so personal appointments block partner slots automatically.'}]
  }
 ]},

{phase:'p30',tag:'Week 4 · Days 16–22',title:'First conversations. The platform call.',
 intro:'You\'re talking to real candidates now. This week you turn conversations into the first verbal yeses, and you make the attribution-platform decision the JD put on your desk.',
 tasks:[
  {id:'w4t1',title:'Days 16–19 — Run partner intro calls (target: 8–10)',day:16,tags:[WHO('candidates'),A('warden')],
   steps:[
    '<b>Use the verbatim script below</b> (the "15-minute intro call" block in this task — copy it). It\'s timed beat-by-beat: 0:00 open → 1:00 how it works → 3:00 what makes it easy → 4:00 the gate → 6:00 hand it over → 13:00 binary close. The job is mutual-fit + plain mechanics, not a hard sell.',
    '<b>Before each call (2 min):</b> reopen the candidate\'s Dossier brief and the one specific piece you referenced in outreach, so the 0:00 open names a real thing they made.',
    '<b>Hit the four beats:</b> (1) why you reached out to THEM specifically, (2) the mechanics — commission / 30-day window / tracked link + kit, (3) the brand-fit gate — first few pieces reviewed by Warden, then they post freely, (4) their questions (this is most of the call — listen).',
    '<b>Frame the gate as protection, not policing:</b> "we read your first 3 posts so they sound like you, not a guru ad — then you\'re free." Operators respect this; it protects THEIR audience\'s trust.',
    '<b>Close on the binary</b> (13:00 beat): "I send the kit today and we talk again [day], OR I set your link up this week — which is easier?" Never end on "let me think."',
    '<b>Log immediately after</b> in <code>partner_pipeline</code>: status → <code>negotiating</code> (a yes/maybe) or <code>passed</code> (a no). <b>Done when</b> 8–10 calls are done and each candidate is moved to one of those two states.'
   ],
   callouts:[{type:'note',title:'The gate is a feature in the pitch',body:'Frame the copy-review gate as protecting THEIR audience\'s trust, not policing them. A partner who recommends something that turns out guru-coded looks bad to their own people. You\'re the quality bar that keeps that from happening.'}]
  },
  {id:'w4t2',title:'Days 20–22 — Decide the attribution platform & write the memo',day:20,tags:[A('ledger'),DAY('JD milestone: by day 30')],
   steps:[
    'You now know your real numbers: ~25 contacted, ~8–10 in conversation, a sense of payout cadence and how much partner-facing polish matters. Decide now.',
    '<b>Reopen the matrix</b> (sidebar → <span class="ui">Attribution Decision</span>) and read the "honest default" callout. For AESDR\'s stage it\'s: <b>extend the custom Supabase + Stripe system</b> for the first ~25 partners ($0), and adopt <b>Rewardful at $49/mo</b> (Stripe-native, cleanest for one-time products) the moment partner self-serve dashboards become the bottleneck.',
    '<b>Write the memo:</b> <code>touch docs/partnerships/attribution-decision.md</code> and fill one page — what you chose, the three gaps it closes, the exact trigger condition that flips you to Rewardful, and the cost both ways. This is a founder-aligned strategic call: email the founder the memo, don\'t just commit it.',
    '<b>Dispatch Ledger to implement</b> (line below) whichever you chose. If extending custom, the first gap to close is link-level click tracking — the <code>/r/[slug]</code> route exists; add the clicks table in the block below and <code>supabase db push</code>. <b>Done when</b> the memo is sent and the choice is implemented.'
   ],
   code:[{label:'if extending custom: link-level click tracking gap',lang:'sql',body:`-- the one gap worth closing first: per-link click attribution.
-- /r/[slug] route already exists; add a clicks table it writes to.
create table if not exists affiliate_link_clicks (
  id uuid primary key default gen_random_uuid(),
  affiliate_slug text not null references affiliates(slug) on delete cascade,
  link_slug text,
  ip_hash text, user_agent text, referrer text,
  utm_source text, utm_medium text, utm_campaign text,
  clicked_at timestamptz not null default now()
);
create index if not exists alc_slug_idx on affiliate_link_clicks(affiliate_slug);
create index if not exists alc_time_idx on affiliate_link_clicks(clicked_at desc);`}]
  }
 ]},
{phase:'p30',tag:'Week 4½ · Days 23–30',title:'Close the phase. Hit the milestone.',
 intro:'Convert verbal yeses into signed, tracked affiliates and lock the Phase-30 milestones: discovery documented, 25 candidates identified, outreach started, platform chosen.',
 tasks:[
  {id:'w5t1',title:'Days 23–27 — Onboard the first 3–5 affiliates (the gate begins)',day:23,tags:[CLI(),A('warden')],
   steps:[
    '<b>Create each affiliate</b> in the browser: go to <span class="where">/admin/affiliates/new</span> → fill display name, email, archetype (from their Dossier brief), set tier <b>developing</b> → <span class="ui">Create</span>. This mints the slug, writes the row, and fires the onboarding email automatically. (Or have Ledger insert via the SQL block — same result.)',
    '<b>Flip status to active:</b> open the new affiliate at <span class="where">/admin/affiliates/[slug]</span> → set status <code>vetting</code> → <code>active</code>. Confirm <code>commission_pct</code> and <code>attribution_window_days</code> read correctly on the row. Tier stays <b>developing</b> — the gate requires 3 approved pieces before they post freely.',
    '<b>Send them two links:</b> their kit access at <span class="where">/affiliates/kit-private</span> and the playbook for their archetype at <span class="where">/affiliates/dashboard/playbooks</span>. One email, both links, from your AESDR address.',
    '<b>Review their first copy as it lands:</b> it appears in <span class="where">/admin/affiliates/queue</span>. Dispatch Warden on each → APPROVE / EDITS / DECLINE. First-timers get EDITS with line rewrites, never DECLINE — you\'re teaching the voice. <b>Done when</b> 3–5 affiliates read <code>active</code>, kit links sent, first copy in review.'
   ],
   code:[{label:'or create an affiliate via CLI/SQL (Ledger)',lang:'sql',body:`insert into affiliates
  (slug, display_name, email, status, archetype,
   sophistication_tier, commission_pct, attribution_window_days)
values
  ('<their-slug>','<Display Name>','<their-email>',
   'active','creator','developing', 40.00, 30);
-- onboarding email fires from the app on status=active
-- NOTE: live schema still defaults commission_pct to 30.00 — set 40.00
-- explicitly until the rate migration lands (see attribution-decision memo)`}]
  },
  {id:'w5t2',title:'Days 28–30 — Phase-30 review + the milestone memo',day:28,tags:[A('almanac'),A('ledger')],
   steps:[
    '<b>Dispatch Ledger first</b> (line below) for the clean Phase-30 metrics pull — the single block returns candidates, contacted, in-conversation, active affiliates, and total attributions in one query. This is the evidence the memo stands on.',
    '<b>Check the four milestones off against real artifacts:</b> ✅ discovery documented → file <code>docs/partnerships/discovery-doctrine.md</code> exists; ✅ 25 candidates → <code>partner_pipeline</code> count ≥25; ✅ outreach started → contacted count; ✅ platform chosen → file <code>docs/partnerships/attribution-decision.md</code> sent. If any is short, that\'s the lede of the memo, not a thing to hide.',
    '<b>Dispatch Almanac</b> (line below) to draft the 30-day founder memo from Ledger\'s pull: numbers vs milestone, what converted, what didn\'t, the one change for Phase 60. 8 lines, not a report.',
    '<b>Send it</b> to the founder (email or the standing Friday channel). <b>Done when</b> the 30-day memo is sent with all four milestones evidenced.'
   ],
   code:[{label:'phase-30 metrics pull',lang:'sql',body:`select
  (select count(*) from partner_pipeline where motion='affiliate') as candidates,
  (select count(*) from partner_pipeline where status='contacted') as contacted,
  (select count(*) from partner_pipeline where status in ('call_booked','negotiating')) as in_convo,
  (select count(*) from affiliates where status='active') as active_affiliates,
  (select count(*) from affiliate_attributions) as attributions_total;`}]
  }
 ]},

/* ══════════ PHASE 60 ══════════ */
{phase:'p60',tag:'Week 5 · Days 31–37',title:'From signed to selling.',
 intro:'Phase 60 is activation. A signed affiliate who never posts is worth zero. This phase is about getting your first cohort actually live, clearing the copy gate, and producing the first attributed dollars.',
 tasks:[
  {id:'w6t1',title:'Days 31–34 — Drive the first cohort through the copy gate',day:31,tags:[A('warden'),WHO('active affiliates')],
   steps:[
    'Each developing-tier affiliate needs 3 approved pieces to exit the gate. Your job: get their copy in, reviewed, and approved fast — a slow review is the #1 cause of month-one dormancy.',
    '<b>Point each affiliate at their playbook:</b> send them <span class="where">/affiliates/dashboard/playbooks</span> → they pick their archetype roadmap → draft their first piece → submit at <span class="where">/affiliates/dashboard/submissions</span>. The submission lands in your queue at <span class="where">/admin/affiliates/queue</span>.',
    '<b>Review within 24 business hours:</b> open the queue, copy the submitted text, dispatch Warden (line below) → it returns APPROVE / EDITS / DECLINE. APPROVE in the admin UI ticks their gate counter up by one; EDITS sends back exact line rewrites in their voice for them to resubmit.',
    '<b>Watch the counter:</b> at 3 approved (developing) or 1 (proven), the gate drops and they post freely. <b>Done when</b> each first-cohort affiliate has ≥1 approved piece and gate-clearers are posting. Tell them when they clear — first live post is the activation moment.'
   ],
   callouts:[{type:'note',title:'Speed is retention',body:'The single biggest cause of affiliate churn in month one is a copy review that takes a week. Warden gives you same-day turnaround. Use it. A partner whose first post is live by day 35 stays; one still waiting on day 45 ghosts.'}]
  },
  {id:'w6t2',title:'Days 35–37 — First attributed dollars + the link mechanics',day:35,tags:[CLI(),A('ledger')],
   steps:[
    'Confirm tracking works end-to-end before volume arrives. The <code>/r/[slug]</code> redirect route already exists — your job is to prove a click writes an attribution.',
    '<b>Run the live test:</b> have one active affiliate post their tracked link (or grab it from their dashboard yourself). Open it in a private/incognito window → confirm it redirects to the buy page. Then complete a test purchase (use a Stripe test card if in test mode, or a real $249 you refund after).',
    '<b>Verify the row appeared</b> (block below, via Ledger): an <code>affiliate_attributions</code> row at status <code>pending</code>, the correct commission amount, and <code>refund_window_closes_at</code> set 30 days out. If no row, the click→attribution wiring is the bug — fix before any real partner sends traffic.',
    '<b>Walk the affiliate through their dashboard:</b> screen-share <span class="where">/affiliates/dashboard</span> so they see their own clicks + pending commission. Self-serve visibility kills the "am I getting credit?" emails before they start.',
    '<b>Confirm the math with Ledger</b> (line below): commission = the program rate × the $249/$299 sale, held <code>pending</code> until the 30-day refund window closes, then <code>cleared</code> for payout. <b>Done when</b> a real test click produced a <code>pending</code> row with the window set.'
   ],
   code:[{label:'verify attribution fired',lang:'sql',body:`select att.affiliate_slug, att.status,
       att.gross_amount_cents/100.0 as sale,
       att.commission_amount_cents/100.0 as commission,
       att.attributed_at, att.refund_window_closes_at
from affiliate_attributions att
order by att.attributed_at desc
limit 10;`}]
  }
 ]},
{phase:'p60',tag:'Week 6 · Days 38–44',title:'Turn on the channel.',
 intro:'The enterprise channel program is built and unlaunched. You are the one who flips it on. This week: identify the first channel candidates and open three conversations — a different motion, a different buyer, the same brand.',
 tasks:[
  {id:'w7t1',title:'Days 38–40 — Dispatch Herald; build the channel target list',day:38,tags:[A('herald')],
   steps:[
    '<b>Head start:</b> Herald has already run — open <span class="ui">Prospect Intel</span> → "Channel prospects" for 10 named orgs (Vendux, Martal Group, Skaled, …) with fit rationale, proposed structure, and conflict flags. Verify these, then extend. Channel partners are orgs that put AESDR in front of sales TEAMS, not consumer creators.',
    '<b>Walk the surface you\'re selling first</b> (browser): <span class="where">aesdr.com/enterprise</span> → <span class="where">/enterprise/channel</span> (the 5 partner categories already defined) → <span class="where">/enterprise/diagnostic</span> → <span class="where">/enterprise/champion-kit</span>. You can\'t pitch channel until you\'ve seen exactly what a partner would resell.',
    '<b>Dispatch Herald</b> (line below) to source 10 candidates across the four target types: sales-enablement consultants, fractional VP-Sales networks, RevOps consultancies, and training firms that LACK a junior-rep curriculum (you fill the gap, not compete).',
    '<b>Run the non-cannibalization test on each</b> (Herald flags it; you enforce): does AESDR fill a gap in their offer, or compete with it? The two firms in Prospect Intel flagged "Conflict" sell a directly competing curriculum — keep them only with a carved-out ICP.',
    '<b>Write them in:</b> have Ledger insert each into <code>partner_pipeline</code> with <code>motion=&#39;channel&#39;</code>. <b>Done when</b> 10 channel candidates are sourced and cut to the 3 strongest at <code>motion=channel</code>.'
   ],
   callouts:[{type:'note',title:'The non-cannibalization test',body:'For every channel candidate Herald proposes, the question is: does AESDR fill a gap in their offer, or compete with it? A sales-training firm that only does senior-AE work has a junior-rep gap you fill. One that already sells a first-year curriculum is a competitor, not a partner. Herald flags this; you enforce it.'}]
  },
  {id:'w7t2',title:'Days 41–44 — Open 3 channel conversations',day:41,tags:[A('herald'),WHO('channel candidates')],
   steps:[
    '<b>Dispatch Herald</b> (line below) to draft the channel first-touch for each of your 3 strongest, using the channel template in the <span class="ui">Outreach Library</span> as the base. It leads with the gap you fill in THEIR practice — never opens with a commission rate.',
    '<b>Pick a structure per partner before you send</b> (name it in the message): referral fee (they intro, you close, they earn %), reseller margin (they sell, keep a margin), or co-delivery (they wrap AESDR into their engagement). The Prospect Intel "Structure" column already proposes one per org — start there.',
    '<b>Send one-to-one</b> from your AESDR address, reply-to <code>affiliates@aesdr.com</code>. If a deal is large enough to need the founder on the call, flag it now per the escalation rule — don\'t discover that mid-negotiation.',
    '<b>Log each</b> to <code>partner_pipeline</code> at <code>motion=&#39;channel&#39;</code>, status tracking the same ladder (contacted → replied → negotiating). <b>Done when</b> 3 channel conversations are open (status <code>replied</code> or <code>negotiating</code>) — the day-60 milestone.'
   ]
  }
 ]},
{phase:'p60',tag:'Week 7 · Days 45–51',title:'Reporting goes live.',
 intro:'You cannot manage what you cannot see, and the founder cannot trust what you cannot show. This week the attribution reporting goes from ad-hoc SQL to a standing, repeatable pull.',
 tasks:[
  {id:'w8t1',title:'Days 45–48 — Stand up the weekly reporting pull',day:45,tags:[CLI(),A('ledger')],
   steps:[
    '<b>Dispatch Ledger</b> (line below) to build the <code>affiliate_weekly_report</code> view from the SQL block — it <code>create or replace view</code>s a single rollup so the weekly pull is one query, not five.',
    '<b>Confirm the view returns the right columns</b> per affiliate: 7-day clicks, pending vs cleared commission, paid-to-date, plus the aggregate trajectory toward $3k/mo. Run <code>supabase db query "select * from affiliate_weekly_report;"</code> once to eyeball it.',
    '<b>Set the Friday ritual</b> (block 2): every Friday run the one-liner that pipes the view to <code>reports/$(date +%Y-%m-%d)-weekly.txt</code>, then dispatch Almanac to turn it into the 8-line founder note. Same time every week — predictability is its own trust signal.',
    '<b>Surface it without asking:</b> add the three headline numbers (active affiliates, cleared commission, trajectory) to an admin dashboard tile in-repo so the founder self-serves. <b>Done when</b> the view exists and the first Friday note is sent.'
   ],
   code:[{label:'reporting view (Ledger builds)',lang:'sql',body:`create or replace view affiliate_weekly_report as
select a.slug, a.display_name, a.status, a.sophistication_tier,
  count(distinct alc.id) as clicks_7d,
  count(distinct att.id) filter (where att.status='pending') as pending_count,
  coalesce(sum(att.commission_amount_cents) filter (where att.status='pending'),0)/100.0 as pending_commission,
  coalesce(sum(att.commission_amount_cents) filter (where att.status='cleared'),0)/100.0 as cleared_commission,
  coalesce(sum(att.commission_amount_cents) filter (where att.status='paid'),0)/100.0 as paid_to_date
from affiliates a
left join affiliate_link_clicks alc
  on alc.affiliate_slug=a.slug and alc.clicked_at > now()-interval '7 days'
left join affiliate_attributions att on att.affiliate_slug=a.slug
group by a.slug,a.display_name,a.status,a.sophistication_tier
order by cleared_commission desc;`},
   {label:'the Friday one-liner',lang:'bash',body:`supabase db query "select * from affiliate_weekly_report;" \\
  | tee "reports/$(date +%Y-%m-%d)-weekly.txt"
# then dispatch Almanac to turn it into the 8-line founder note`}]
  },
  {id:'w8t2',title:'Days 49–51 — First payout dry-run',day:49,tags:[CLI(),A('ledger'),WHO('Founder')],
   steps:[
    'By now your earliest attributions are clearing the 30-day window. Run a payout DRY-RUN before any real money moves — never trigger a real payout from inside an agent.',
    '<b>Dispatch Ledger for the dry-run</b> (block below): it lists cleared-but-unpaid attributions totaled per affiliate. The batch logic itself already exists as Stripe Connect transfers in <code>app/actions/affiliate.ts</code> — Ledger only reports, it does not pay.',
    '<b>Walk the founder through the numbers</b> before any transfer: per-affiliate totals, the grand total, anything anomalous (Ledger flags refund rate >15% or one affiliate >60% of volume). This first run is a founder-approved money decision, not a solo call.',
    '<b>Run the real batch in the UI:</b> with founder approval, go to <span class="where">/admin/affiliates/[slug]</span> → the payout helper → confirm the amount → execute. <b>Done when</b> Stripe shows the transfer and the affiliate\'s dashboard reads "paid".'
   ],
   code:[{label:'payout dry-run',lang:'sql',body:`-- cleared, not yet paid = ready for payout
select affiliate_slug,
       count(*) as items,
       sum(commission_amount_cents)/100.0 as payout_due
from affiliate_attributions
where status='cleared' and paid_at is null
group by affiliate_slug
order by payout_due desc;`}]
  }
 ]},
{phase:'p60',tag:'Week 8 · Days 52–60',title:'Close Phase 60. Both motions breathing.',
 intro:'Lock the milestones: 10 affiliates onboarded, 3 channel conversations open, reporting live. Then stabilize so Phase 90 compounds instead of firefighting.',
 tasks:[
  {id:'w9t1',title:'Days 52–56 — Push to 10 active affiliates',day:52,tags:[A('scribe'),A('warden')],
   steps:[
    '<b>Work the warm middle first:</b> query <code>partner_pipeline</code> for everyone at status <code>negotiating</code> — these are your fastest path to active. Send each the onboarding follow-up; run them through the w5t1 create-affiliate flow as they say yes.',
    '<b>Unstick the gate-stalled</b> (block this against new outreach): for any developing-tier affiliate sitting on an unfinished first piece, book a 15-min co-writing call — you + Warden draft their first approved post live. This revives a stalled partner faster than three async rounds or any new cold name.',
    '<b>Refill only if thinning:</b> if the funnel is below 2× your remaining target, dispatch Scout (line below) for a fresh sweep, then scribe + warden the survivors through. Do NOT lower the voice-fit bar to pad the count.',
    '<b>Hold the bar:</b> 7 great affiliates on a $3k trajectory beats 10 where 4 never post. <b>Done when</b> 10 affiliates read <code>active</code> with ≥1 approved piece each — or you\'ve given the founder the honest lower number and why.'
   ]
  },
  {id:'w9t2',title:'Days 57–60 — Phase-60 review + the trajectory check',day:57,tags:[A('almanac'),A('ledger')],
   steps:[
    '<b>Check the three milestones against artifacts:</b> ✅ 10 affiliates → <code>active</code> count; ✅ 3 channel conversations → <code>motion=channel</code> at <code>replied/negotiating</code>; ✅ reporting live → the <code>affiliate_weekly_report</code> view + a sent Friday note exist.',
    '<b>Dispatch Ledger for the trajectory math</b> (block below): cleared + pending commission by month. The leading indicator for the Phase-90 $3k/mo goal is whether this is trending toward $3k run-rate — pending counts, it just hasn\'t cleared the window yet.',
    '<b>Dispatch Almanac</b> for the 60-day founder memo: which affiliates are producing, which channel conversation is closest, the one bottleneck to remove for Phase 90.',
    '<b>Decide the Phase-90 bet and write it in the memo:</b> wider (more affiliates) or deeper (overinvest in the top 3)? Let the trajectory data pick — usually deeper wins this late. <b>Done when</b> the 60-day memo is sent and the wider-vs-deeper bet is decided.'
   ],
   code:[{label:'trajectory toward $3k/mo',lang:'sql',body:`select date_trunc('month', attributed_at) as month,
       sum(commission_amount_cents)/100.0 as commission_booked,
       count(*) as deals
from affiliate_attributions
group by 1 order by 1 desc;`}]
  }
 ]},

/* ══════════ PHASE 90 ══════════ */
{phase:'p90',tag:'Week 9 · Days 61–67',title:'Double down on what converts.',
 intro:'Phase 90 is proof. You have data now — which partners, which formats, which messages convert. Stop spreading thin; pour into the winners and turn the first channel conversation into paper.',
 tasks:[
  {id:'w10t1',title:'Days 61–64 — Find your top 3 and overinvest',day:61,tags:[A('ledger'),A('almanac')],
   steps:[
    '<b>Dispatch Ledger</b> (line 1 below) to run the top-3 ranking query in the block — affiliates ordered by attributed commission. These three are where Phase-90 revenue comes from.',
    '<b>Dispatch Almanac</b> (line 2) to extract WHY each top-3 converted: format (newsletter vs community vs podcast), message angle, audience. You\'re looking for the repeatable pattern, not praise.',
    '<b>Overinvest, three concrete moves:</b> (1) co-create a second piece with each; (2) offer a workshop — the registration + confirmation system is already built at <span class="where">/[slug]/workshop</span>, just schedule one; (3) bump a proven performer to <code>proven</code> tier in the admin UI so their copy-gate drops to 1 piece.',
    '<b>Clone the pattern</b> (line 3): dispatch Scout to find 10 more partners who look like your top 3 — same surface, same archetype. <b>Done when</b> the top 3 are identified, each has a second piece or workshop in motion, and Scout is finding lookalikes.'
   ],
   code:[{label:'top performers',lang:'sql',body:`select a.slug, a.display_name, a.archetype,
       sum(att.commission_amount_cents)/100.0 as commission,
       count(att.*) as deals
from affiliates a join affiliate_attributions att on att.affiliate_slug=a.slug
group by a.slug,a.display_name,a.archetype
order by commission desc limit 3;`}]
  },
  {id:'w10t2',title:'Days 65–67 — Move the lead channel deal toward signature',day:65,tags:[A('herald'),WHO('Founder + lead channel partner')],
   steps:[
    '<b>Pick the lead:</b> of your 3 channel conversations, identify the one furthest along (status <code>negotiating</code>, warmest replies). That\'s the one you push to signed-or-close for the milestone — don\'t split focus across all three this late.',
    '<b>Dispatch Herald to draft the terms</b> (line below): the structure (referral / reseller / co-delivery), the attribution mechanism (how an enterprise deal traces back to them — promo code, dedicated link, or manual ref), the commercial split, and the term length. Put it in a one-page terms doc, not a 12-page contract.',
    '<b>Bring the founder in for the close:</b> schedule a 3-way call. Channel deals are relationship + paper, and a founder signature carries weight an IC\'s can\'t. You drive the mechanics; the founder lends the gravity.',
    '<b>Flag legal early</b> if anything is contractual or scope-changing — per the escalation rule, don\'t let paperwork stall a verbal yes. <b>Done when</b> the lead channel deal has draft terms in front of the partner and the founder is looped in.'
   ]
  }
 ]},
{phase:'p90',tag:'Week 10–11 · Days 68–81',title:'Systematize. Make it run without heroics.',
 intro:'A function that only works when you\'re manually pushing every lever isn\'t a function — it\'s a bottleneck with your name on it. These two weeks turn the motion into a cadence that runs on rails.',
 tasks:[
  {id:'w11t1',title:'Days 68–74 — Codify the operating cadence',day:68,tags:[A('almanac')],
   steps:[
    '<b>Create the doc:</b> <code>touch docs/partnerships/operating-cadence.md</code>. Write the weekly rhythm explicitly by day: Monday = Almanac standup + Scout sweep; Tue–Thu = outreach + calls + copy review; Friday = Ledger report + Almanac review + founder note. A stranger should be able to run your week from this file.',
    '<b>Codify the agent dispatch rhythm</b> as a table in the doc: Scout weekly · Dossier on-demand · Scribe per-outreach · Warden per-submission (24h SLA) · Ledger Fridays · Almanac daily · Herald bi-weekly. Paste the actual dispatch line for each so it\'s copy-runnable.',
    '<b>Document the follow-up ladder as logic</b>, not prose: <code>contacted → +4 days → +9 days → cold</code>, with the exact <code>partner_pipeline</code> status transitions at each step. This is what a future hire (or an Agent-SDK cron) automates.',
    'This is the JD\'s real success deliverable — "runs without founder day-to-day involvement." <b>Done when</b> <code>operating-cadence.md</code> is committed and a stranger could run your week from it.'
   ]
  },
  {id:'w11t2',title:'Days 75–81 — Second affiliate wave + workshop pilot',day:75,tags:[A('scout'),A('scribe'),WHO('top affiliate')],
   steps:[
    '<b>Run the second wave at scale</b> (line below): Scout sweep → Dossier → Scribe → the ladder — same process you proved in Phase 30, now for 25 more with no hand-holding because the machine works. Pull from the <code>cold</code> rows you parked in w2t2 plus fresh Scout results.',
    '<b>Pilot a workshop with your strongest affiliate:</b> the registration + confirmation system is already built — send them <span class="where">/[slug]/workshop</span> (their slug), pick a date in US Central business hours, and co-promote. A live workshop converts 3–5× a link drop.',
    '<b>Push self-serve onboarding:</b> point every new partner at <span class="where">/affiliates/dashboard/playbooks</span> so they ramp without you in the loop. The leverage you built in Phase 30 pays off now as reduced hand-holding.',
    '<b>Stock the next quarter:</b> keep the funnel deep enough that day-90 isn\'t a cliff. <b>Done when</b> 25 new candidates are in the funnel and one workshop is scheduled with your top affiliate.'
   ]
  }
 ]},
{phase:'p90',tag:'Week 12–13 · Days 82–90',title:'Prove it. Hand the founder a running machine.',
 intro:'The final stretch: hit the $3k/mo trajectory, get the channel deal signed or clearly close, and deliver the 90-day proof that the function exists and runs.',
 tasks:[
  {id:'w12t1',title:'Days 82–86 — Hit the $3k/mo trajectory + run payouts clean',day:82,tags:[A('ledger'),CLI()],
   steps:[
    '<b>Dispatch Ledger for the run-rate</b> (block 1): booked commission (pending + cleared) this month vs the $3k target. If close-but-under, your lever is the Week-9 top-3 overinvestment — push one more piece from each, don\'t chase new cold partners this late.',
    '<b>Run the month-end payout solo</b> now (founder approved the process in Phase 60): payout helper at <span class="where">/admin/affiliates/[slug]</span> → confirm → execute. Verify every cleared attribution pays, every affiliate dashboard reads "paid", and Stripe reconciles.',
    '<b>Run the refund-rate health check</b> (block 2): if any affiliate is over 15%, that\'s a partner over-promising — book a Warden review + a debrief call, it\'s a copy problem, not a payout problem. Suspend only at 20% per the benchmark policy.',
    '<b>Update the founder dashboard tile</b> with the live trajectory so it\'s visible without asking. <b>Done when</b> run-rate is at/near $3k/mo, the payout ran clean, and refund rate is under 15%.'
   ],
   code:[{label:'run-rate + health check',lang:'sql',body:`-- monthly run-rate
select sum(commission_amount_cents)/100.0 as booked_this_month
from affiliate_attributions
where attributed_at > date_trunc('month', now());

-- refund-rate health
select round(100.0 * count(*) filter (where status='refunded')
       / nullif(count(*),0), 1) as refund_pct
from affiliate_attributions;`}]
  },
  {id:'w12t2',title:'Days 87–90 — The 90-day proof + the next-quarter plan',day:87,tags:[A('almanac'),A('ledger'),WHO('Founder')],
   steps:[
    '<b>Build the proof:</b> dispatch Ledger (line 1) for the full 90-day metrics pull, then Almanac (line 2) to write it up. Evidence all three milestones with a number or an artifact each: ✅ affiliates on $3k/mo trajectory (run-rate), ✅ one channel partnership signed or close (the terms doc), ✅ both motions running (active affiliate + channel counts).',
    '<b>Show the cadence doc</b> (<code>docs/partnerships/operating-cadence.md</code>) as the proof the function runs without founder day-to-day involvement — the JD\'s real success definition, not any single metric.',
    '<b>Present the next-quarter plan:</b> the second-wave pipeline (25+ warm), the channel deals in flight, the top-performer playbook to clone, and the one tool you\'d add now that the data justifies it (e.g. Rewardful at the dashboard-bottleneck trigger).',
    'This is also your own 90-day review — the JD has one built in, both sides. You walk in with a running machine and the numbers to prove it. <b>Done when</b> the 90-day proof is delivered, three milestones evidenced, next-quarter plan presented.'
   ],
   callouts:[{type:'note',title:'What "overachieve" actually looks like here',body:'Not 10 affiliates — 15. Not "3 conversations" — one signed channel deal + 3 more open. Not "reporting live" — a founder who hasn\'t had to ask for a number in a month because it\'s already in front of him every Friday. The bar isn\'t the milestones; it\'s making the milestones look conservative.'}]
  }
 ]}
];

/* ─── PROSPECT INTEL (Run A: affiliate; Run B: channel) — researched May 2026 ─── */

function buildNav(){
  const el=document.getElementById('navList');
  el.innerHTML = NAV.map(item=>{
    if(item.g) return `<div class="navGroup">${item.g}</div>`;
    return `<a class="navItem" data-sec="${item.id}" onclick="showSection('${item.id}')">
      <span class="ni-num">${item.n}</span><span>${item.label}</span></a>`;
  }).join('');
}

function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('show'));
  const sec=document.getElementById('sec-'+id);
  if(sec)sec.classList.add('show');
  document.querySelectorAll('.navItem').forEach(n=>n.classList.toggle('active',n.dataset.sec===id));
  document.querySelector('.sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* tag rendering */
function renderTags(tags){
  return (tags||[]).map(t=>{
    if(t.type==='agent'){const a=AGENTS.find(x=>x.id===t.id);return `<span class="tag agent" onclick="event.stopPropagation();openAgent('${t.id}')">⚡ ${a?a.name:t.id}</span>`;}
    if(t.type==='cli')return `<span class="tag cli">&gt;_ terminal</span>`;
    if(t.type==='who')return `<span class="tag who">◷ ${esc(t.t)}</span>`;
    if(t.type==='day')return `<span class="tag t-day">★ ${esc(t.t)}</span>`;
    return '';
  }).join('');
}

/* code block rendering with copy */
let codeId=0;
function renderCode(blocks){
  if(!blocks)return '';
  return blocks.map(b=>{
    const id='code'+(codeId++);
    return `<div class="codeBlock">
      <div class="cbHead"><span class="cbLabel">${esc(b.label)} · ${b.lang}</span>
        <button class="copyBtn" onclick="copyCode('${id}',this)">Copy</button></div>
      <pre id="${id}">${esc(b.body)}</pre></div>`;
  }).join('');
}
function renderCallouts(cs){
  if(!cs)return '';
  return cs.map(c=>`<div class="callout ${c.type==='who'?'who':''}">
    <div class="cTitle">${esc(c.title)}</div>${c.body}</div>`).join('');
}

/* interactions */
function toggleWeek(firstId){
  const wk=document.getElementById('week-'+firstId);
  wk.querySelector('.weekHead').classList.toggle('open');
  wk.querySelector('.weekBody').classList.toggle('open');
}
function toggleTask(id){document.getElementById('task-'+id).classList.toggle('open');}
function toggleDone(id){
  store.done[id]=!store.done[id];store.save();
  const t=document.getElementById('task-'+id);
  t.classList.toggle('done',store.done[id]);
  t.querySelector('.checkbox').classList.toggle('done',store.done[id]);
  updateProgress();
}
function updateProgress(){
  const total=allTasks.length;
  const done=allTasks.filter(t=>store.done[t.id]).length;
  const pct=Math.round(100*done/total);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+'%';
  // per-week counts
  WEEKS.forEach(w=>{
    const el=document.querySelector('[data-wc="'+w.tasks[0].id+'"]');
    if(el){const d=w.tasks.filter(t=>store.done[t.id]).length;el.textContent=d+'/'+w.tasks.length;}
  });
  // phase ribbons
  PHASES.forEach(p=>{
    const wk=WEEKS.filter(w=>w.phase===p.id).flatMap(w=>w.tasks);
    const d=wk.filter(t=>store.done[t.id]).length;
    const bar=document.querySelector('[data-rib="'+p.id+'"]');
    if(bar)bar.style.width=Math.round(100*d/wk.length)+'%';
  });
}
